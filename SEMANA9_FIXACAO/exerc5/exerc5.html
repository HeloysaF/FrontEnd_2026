<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Convidados VIP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }

    input {
      width: 70%;
      padding: 8px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 10px;
      margin: 2px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 15px;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .riscado {
      text-decoration: line-through;
      color: gray;
      opacity: 0.7;
    }

    .acoes button {
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Convidados VIP</h2>

    <input type="text" id="nome" placeholder="Nome do convidado">
    <button onclick="adicionar()">Adicionar</button>

    <ul id="lista"></ul>
  </div>

  <script src="script.js"></script>

</body>
</html>
