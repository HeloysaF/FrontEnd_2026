<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Página</title>

  <style>
  body {
  margin: 0;
  overflow-x: hidden;
}
  
  
.fundo {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.5s ease-in-out;
  z-index: -1;
}

#fundoDia {
  background-image: url('fundo.png');
  opacity: 1;
}

#fundoNoite {
  background-image: url('noite.png');
  opacity: 0;
}

/* Quando estiver de noite */
.noite #fundoNoite {
  opacity: 1;
}

.noite #fundoDia {
  opacity: 0;
}

#estrelas {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0;
}

/* noite */
.noite #estrelas {
  opacity: 1;
  animation: piscar 2s infinite alternate ease-in-out;
}

@keyframes piscar {
  0%   { opacity: 0.3; }
  100% { opacity: 1; }
}

.estrela-cadente {
  position: fixed;
  width: 2px;
  height: 80px;
  background: white;
  z-index: 10;
  transform: rotate(45deg);
  animation: cairDiagonal 1s linear forwards;
}

@keyframes cairDiagonal {
  from {
    transform: translate(0, 0) rotate(45deg);
    opacity: 1;
  }
  to {
    transform: translate(300px, 600px) rotate(45deg);
    opacity: 0;
  }
}
.placa-nome {
    background: linear-gradient(to bottom, #ffffff, #dcdcdc);
    padding: 6px 16px;
    border-radius: 12px;
    border: 2px solid #444;
    box-shadow: 0 4px 0 #222;
    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    color: #222;
    text-shadow: 1px 1px 0 #fff;
    margin-bottom: 6px;
}
body.noite .placa-nome {
    background: linear-gradient(to bottom, #2b2b4a, #1a1a2e);
    border: 2px solid #888;
    color: #fff;
    text-shadow: 1px 1px 2px #000;
}



  </style>
</head>

<body class="min-h-screen flex flex-col">
 <div id ="fundoDia" class="fundo"></div>
<div id="fundoNoite" class="fundo"></div>
<div id="estrelas"></div>


  <div class="w-full flex items-center justify-start p-4 gap-4">
 
    <div class="avatar">
      <div class="w-16 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
        <img src="img1.png" />
      </div>
    </div>

  <input 
  type="text" 
  id="nomeCriatura"
  placeholder="Nome da criatura..." 
  class="input input-secondary"
/>
<button onclick="salvarNome()" class="btn btn-primary">
  Salvar nome
</button>
<label class="flex items-center gap-2">
  🌞
  <input type="checkbox"
         class="toggle toggle-primary"
         onchange="alternarTema(this.checked)">
  🌙
</label>

  </div>


  <div class="flex flex-col items-center w-full px-4">
    <div class="placa-nome">
    <span id="nomeExibido">Criaturinha</span>
  </div>
 
    <img 
      id="mainImage"
      src="img1.png"
      alt="Imagem principal"
      class="w-full max-w-md h-auto"
    />

    <div class="mt-12 flex justify-center w-full">
      <img 
        id="btnImage"
        src="img6.png"
        alt="Botão"
        class="w-1/3 max-w-[180px] h-auto active:scale-95 transition"
        onclick="alimentar()"
      />
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
