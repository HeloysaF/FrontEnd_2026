<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAIXA LIVRE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .topo{
            background:#ffc107;
            text-align:center;
            font-size:43px;
            font-weight:bold;
            border:2px solid #000faf;
        }

        .painel{
            background:#aaa;
            padding:10px;
            margin-bottom:15px;
            border:2px solid #000faf;
        }

        .total{
            font-size:32px;
            text-align:right;
            font-weight:bold;
        }
    </style>
</head>

<body class="bg-primary bg-gradient">

<div class="container mt-3">

    <div class="topo">CAIXA LIVRE</div>

    <div class="row mt-3">

        <div class="col-md-7">
            <h3 class="text-white">
                <span class="badge text-bg-primary">SUA COMPRA</span>
            </h3>
            <ul id="lista" class="list-group"></ul>
        </div>

        <div class="col-md-5">

            <div class="painel">
                TOTAL: R$ <span class="total">0.00</span>
            </div>

            <div class="painel">
                <label>CÓDIGO DE BARRAS</label>
                <input type="text" id="cod" class="form-control">
            </div>

            <div class="painel">
                <label>QUANTIDADE</label>
                <input type="number" id="qtd" value="1" class="form-control">
            </div>

            <div class="painel">
                SUBTOTAL: R$ <span id="sub">0.00</span>
            </div>

            <button class="btn btn-success w-100" onclick="addProduto()">
                ADICIONAR PRODUTO
            </button>

            <button class="btn btn-danger w-100 mt-2" onclick="finalizarCompra()">
                FINALIZAR COMPRA
            </button>

        </div>
    </div>
</div>

<!-- IMPORTANTE: link com JS -->
<script src="script.js"></script>

</body>
</html>
